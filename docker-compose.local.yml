services:
  sentinel-ml-worker:
    build:
      context: .
      dockerfile: Dockerfile.local
    image: sentinel-ml-worker:local
    container_name: sentinel-ml-worker-local
    restart: unless-stopped
    ports:
      - "50051:50051"
    environment:
      GRPC_PORT: 50051
      PYTHONUNBUFFERED: "1"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; s = socket.socket(); s.connect((\"localhost\", 50051)); s.close()'"]
      interval: 5s
      timeout: 5s
      retries: 5
