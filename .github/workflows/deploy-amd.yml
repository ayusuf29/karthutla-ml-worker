name: Deploy Heavy-Compute Worker to AMD Cloud (ROCm)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push AMD ROCm Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-amd-cloud:
    name: Deploy to AMD Cloud Compute Instance
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH to AMD Cloud VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AMD_SSH_HOST }}
          username: ${{ secrets.AMD_SSH_USER }}
          key: ${{ secrets.AMD_SSH_PRIVATE_KEY }}
          port: ${{ secrets.AMD_SSH_PORT || 22 }}
          script: |
            set -e
            echo "==> Authenticating to GitHub Container Registry on AMD host..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            CONTAINER_NAME="sentinel-ml-worker-amd"
            IMAGE_LATEST="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

            echo "==> Pulling latest AMD ROCm ML Worker image: $IMAGE_LATEST..."
            docker pull "$IMAGE_LATEST"

            echo "==> Stopping existing container if running..."
            docker stop "$CONTAINER_NAME" || true
            docker rm "$CONTAINER_NAME" || true

            echo "==> Starting new AMD ROCm ML Worker container..."
            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              --device=/dev/kfd \
              --device=/dev/dri \
              --security-opt seccomp=unconfined \
              --group-add video \
              --group-add render \
              -p 50051:50051 \
              -e GRPC_PORT=50051 \
              -e PYTHONUNBUFFERED=1 \
              "$IMAGE_LATEST"

            echo "==> Verifying container health..."
            sleep 5
            docker ps --filter "name=$CONTAINER_NAME"

            echo "==> Checking ROCm GPU status on AMD host..."
            if command -v rocm-smi &> /dev/null; then
              rocm-smi --showuse
            else
              echo "Note: rocm-smi command not in standard PATH or running CPU fallback mode."
            fi

            echo "==> AMD Cloud ML Worker deployed successfully on port 50051!"
