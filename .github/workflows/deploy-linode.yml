name: Build & Deploy ML Worker to Akamai Linode

on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '.github/workflows/deploy-linode.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push ML Worker Container Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and Push Docker Image (CPU Mode)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.local
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-linode:
    name: Deploy to Akamai Linode Server
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Remote Docker Pull via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LINODE_HOST }}
          username: ${{ secrets.LINODE_USER }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          port: ${{ secrets.LINODE_PORT || 22 }}
          script: |
            set -e
            echo "==> Masuk ke direktori aplikasi..."
            cd /opt/karhutla-sentinel

            echo "==> Menarik image ML Worker terbaru dari GHCR..."
            docker compose -f docker-compose.linode.yml pull sentinel-ml-worker

            echo "==> Melakukan rolling restart ML Worker service..."
            docker compose -f docker-compose.linode.yml up -d --no-deps sentinel-ml-worker

            echo "==> Membersihkan image docker yang sudah usang..."
            docker image prune -f

            echo "==> Deployment ML Worker selesai!"

