# Nginx HTTP/2 gRPC TLS Reverse Proxy for Sentinel AMD Worker
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ml.your-domain.com;

    # SSL Certificates (e.g. Let's Encrypt Certbot)
    ssl_certificate /etc/letsencrypt/live/ml.your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ml.your-domain.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # gRPC Traffic Routing
    location / {
        grpc_pass grpc://sentinel-ml-worker-amd:50051;
        
        # gRPC Specific Headers & Timeouts
        grpc_read_timeout 60s;
        grpc_send_timeout 60s;
        client_max_body_size 50m;
        
        # Pass client IP
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
